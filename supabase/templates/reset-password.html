<!-- Supabase → Authentication → Emails → Templates → «Reset password».
     Тема письма: Смена пароля — SMM KADR -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#111827">
  <div style="font-size:22px;font-weight:800;color:#1845D2;letter-spacing:-0.3px">SMM KADR</div>
  <h2 style="margin:20px 0 8px;font-size:20px">Смена пароля</h2>
  <p style="margin:0 0 20px;font-size:15px;line-height:1.5">Нажмите кнопку и придумайте новый пароль. Ссылка срабатывает один раз; если запрашивали несколько писем — откройте самое последнее.</p>
  <p style="margin:0 0 24px">
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery"
       style="display:inline-block;background:#1845D2;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 24px;border-radius:12px">Сменить пароль</a>
  </p>
  <p style="margin:0;font-size:12px;color:#5f6b7a">Если вы не запрашивали смену пароля, ничего не делайте — пароль останется прежним.</p>
</div>
